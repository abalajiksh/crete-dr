<!doctype html>
<!--
  Hand-written, not a SvelteKit route. svelte.config.js deliberately sets no
  `fallback`: the SvelteKit fallback shell renders blank without JavaScript,
  which is a poor 404. wrangler.jsonc's not_found_handling serves this instead.

  It is the one file allowed to repeat design-token values, because it cannot
  link the fingerprinted app CSS. Keep it in step with site.css if the shell
  colours change.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Not found — crête</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			@font-face {
				font-family: 'Archivo';
				font-style: normal;
				font-weight: 400 800;
				font-display: swap;
				src: url('/fonts/archivo-var-latin.woff2') format('woff2');
			}

			:root {
				--bg: #f3f2f2;
				--text: #201e1d;
				--accent: #ec3013;
				--accent-deep: #ae1800;
				--divider: rgba(32, 30, 29, 0.4);
				--muted: #605d5d;
				color-scheme: light;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a1918;
					--text: #f3f2f2;
					--accent-deep: #ff9783;
					--divider: rgba(243, 242, 242, 0.38);
					--muted: #a8a4a4;
					color-scheme: dark;
				}
			}

			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font-family: 'Archivo', system-ui, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}

			.wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: 0 24px;
				width: 100%;
				box-sizing: border-box;
			}

			header {
				border-bottom: 2px solid var(--divider);
				padding: 14px 0;
				font-weight: 800;
				font-size: 18px;
			}

			header a {
				color: inherit;
				text-decoration: none;
			}

			.dot {
				color: var(--accent);
			}

			main {
				flex: 1;
				padding: 96px 0;
			}

			h1 {
				font-size: clamp(52px, 8vw, 104px);
				line-height: 0.94;
				letter-spacing: -0.03em;
				margin: 0 0 24px;
				max-width: 14ch;
			}

			p {
				font-size: 19px;
				line-height: 1.5;
				max-width: 52ch;
				margin: 0 0 32px;
			}

			.links {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
			}

			.btn {
				display: inline-block;
				padding: 10px 18px;
				border: 2px solid var(--accent);
				text-decoration: none;
				font-size: 14px;
				font-weight: 600;
			}

			.btn-primary {
				background: var(--accent);
				color: #f8f4f4;
			}

			.btn-secondary {
				color: var(--accent-deep);
				border-color: var(--divider);
			}

			.btn:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			footer {
				border-top: 2px solid var(--divider);
				padding: 24px 0 48px;
				font-size: 13px;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<header><div class="wrap"><a href="/">crête<span class="dot">.</span></a></div></header>
		<main>
			<div class="wrap">
				<h1>No reading at that address.</h1>
				<p>
					The page you asked for does not exist. Everything crête publishes is one of five pages —
					start from the overview, or go straight to the test methodology.
				</p>
				<div class="links">
					<a class="btn btn-primary" href="/">Overview</a>
					<a class="btn btn-secondary" href="/testing/">Testing</a>
					<a class="btn btn-secondary" href="/standards/">Standards</a>
					<a class="btn btn-secondary" href="/formats/">Formats</a>
					<a class="btn btn-secondary" href="/changelog/">Changelog</a>
				</div>
			</div>
		</main>
		<footer><div class="wrap">codeberg.org/abksh/Crete</div></footer>
	</body>
</html>
