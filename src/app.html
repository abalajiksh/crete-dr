<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Only the two latin faces are preloaded; latin-ext stays on demand. -->
		<link
			rel="preload"
			href="/fonts/archivo-var-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/plexmono-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Resolve the theme before first paint, so a dark-mode visitor never
		     sees a light flash. Keep the storage key in step with src/lib/theme.js. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('crete-theme');
					if (t !== 'dark' && t !== 'light') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-theme', t);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
